<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lối Đi – Bản đồ & chỉ đường Hà Nội</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
:root{
  --blue:#1a73e8;--blue2:#4285f4;--green:#188038;--red:#ea4335;--txt:#202124;--sub:#5f6368;--bd:#dadce0;--hov:#f1f3f4;
  --shadow:0 2px 6px rgba(60,64,67,.3),0 1px 2px rgba(60,64,67,.15);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --sheet-h:0px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--txt);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#map{position:fixed;inset:0;background:#e5e3df}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit;color:inherit}
svg{display:block}

/* ---------- Khung UI trái / trên ---------- */
.ui{position:fixed;z-index:1000;top:calc(var(--sat) + 10px);left:calc(var(--sal) + 10px);width:408px;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - var(--sat) - var(--sab) - 20px);pointer-events:none}
.ui>*{pointer-events:auto}
.card{background:#fff;border-radius:12px;box-shadow:var(--shadow)}
.searchbar{display:flex;align-items:center;height:48px;padding:0 4px;border-radius:24px;flex:none}
.searchbar input{flex:1;border:0;outline:0;font-size:16px;height:100%;background:transparent;min-width:0;padding:0 4px}
.ibtn{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--sub);flex:none;padding:0}
.ibtn:hover{background:var(--hov)}
.ibtn svg{width:22px;height:22px;fill:currentColor}
.ibtn.blue{color:var(--blue)}
.vsep{width:1px;height:26px;background:var(--bd);margin:0 2px}

.dircard{padding:8px 4px 8px;flex:none}
.dirrow{display:flex;align-items:center;gap:2px}
.dirinputs{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.fld{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:8px;height:40px;padding:0 10px;background:#fff}
.fld:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.fld input{flex:1;border:0;outline:0;font-size:15px;min-width:0;background:transparent}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.a{border:2.5px solid #5f6368}
.dot.b{background:var(--red)}
.modes{display:flex;gap:6px;padding:8px 8px 0}
.mode{flex:1;border:0;background:var(--hov);border-radius:18px;height:34px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:13px}
.mode svg{width:18px;height:18px;fill:currentColor}
.mode.on{background:#e8f0fe;color:var(--blue);font-weight:600}

.menu{padding:6px 0;flex:none}
.menu button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:11px 18px;font-size:15px;text-align:left}
.menu button:hover{background:var(--hov)}
.menu svg{width:20px;height:20px;fill:var(--sub)}

.sugg{max-height:min(55vh,440px);overflow:auto;padding:6px 0;flex:none;-webkit-overflow-scrolling:touch}
.it{display:flex;gap:12px;padding:9px 16px;cursor:pointer;align-items:center}
.it:hover,.it.act{background:var(--hov)}
.it .ic{width:32px;height:32px;border-radius:50%;background:var(--hov);display:grid;place-items:center;flex:none}
.it .ic svg{width:18px;height:18px;fill:var(--sub)}
.it .ic.me svg{fill:var(--blue)}
.it .ic.fav svg{fill:#f9ab00}
.it .tx{min-width:0;flex:1}
.it .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg .msg{padding:12px 18px;color:var(--sub);font-size:14px}

/* ---------- Panel ---------- */
.panel{overflow:auto;min-height:0;flex:0 1 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.handle{display:none}
.pb{padding:16px 18px}
.pt{margin:0 0 4px;font-size:22px;font-weight:500;line-height:1.25}
.sub{color:var(--sub);font-size:14px;line-height:1.4}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px}
.btn{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--bd);background:#fff;color:var(--blue);font-weight:500;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:hover{background:#f6f9fe}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:#1765cc}
.btn.danger{color:#d93025}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.hdr h3{margin:0;font-size:17px;font-weight:500}
.rt{display:flex;align-items:center;gap:10px;padding:12px 18px;border-left:4px solid transparent;cursor:pointer}
.rt:hover{background:#fafafa}
.rt.on{border-left-color:var(--blue);background:#f4f8fe}
.rt .l{flex:1;min-width:0}
.rt .t{font-size:18px;font-weight:600;color:var(--green)}
.rt .t small{color:var(--sub);font-weight:400;font-size:14px;margin-left:6px}
.rt .s{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;background:#e6f4ea;color:var(--green);padding:3px 8px;border-radius:10px;white-space:nowrap}
.divider{height:8px;background:#f1f3f4;margin:8px 0}
.step{display:flex;gap:14px;padding:10px 18px;cursor:pointer;align-items:flex-start}
.step:hover{background:#fafafa}
.step .si{width:24px;flex:none;padding-top:1px}
.step .si svg{width:22px;height:22px;fill:var(--sub)}
.step .sx{flex:1;border-bottom:1px solid #f1f3f4;padding-bottom:10px;min-width:0}
.step .st{font-size:14.5px;line-height:1.35}
.step .sd{font-size:12.5px;color:var(--sub);margin-top:2px}
.fav{display:flex;align-items:center;gap:12px;padding:10px 18px}
.fav .ic svg{width:22px;height:22px;fill:#f9ab00}
.fav .tx{flex:1;min-width:0;cursor:pointer}
.fav .t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav .s{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav .btn{height:32px;padding:0 12px;font-size:13px}
.empty{padding:16px 18px 22px;color:var(--sub);font-size:14px}
.spin{width:22px;height:22px;border:3px solid #d2e3fc;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.err{padding:16px 18px;color:#d93025;font-size:14px}

/* ---------- Leaflet ---------- */
.leaflet-bottom{transition:bottom .2s}
.leaflet-control-layers{border-radius:10px!important;box-shadow:var(--shadow)!important;border:0!important}
.leaflet-control-layers-expanded{padding:8px 12px 8px 8px;font-size:13.5px}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important;border-radius:10px!important;overflow:hidden}
.leaflet-bar a{width:40px!important;height:40px!important;line-height:40px!important;font-size:20px!important;color:#555!important}
.fab{width:40px;height:40px;border-radius:10px;border:0;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;color:#666;padding:0}
.fab svg{width:22px;height:22px;fill:currentColor}
.fab.on{color:var(--blue)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:12px 14px}
.pp{min-width:210px;font-family:inherit}
.pp-t{font-size:15px;font-weight:500;margin-bottom:2px;color:var(--txt)}
.pp-s{font-size:12px;color:var(--sub);margin-bottom:10px}
.pp-b{display:flex;gap:6px}
.pp-b button{flex:1;height:34px;border-radius:17px;border:1px solid var(--bd);background:#fff;color:var(--blue);font-weight:500;font-size:13px;padding:0 8px}
.pp-b button.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.pp-l{margin-top:6px;width:100%;height:30px;border:0;background:none;color:var(--sub);font-size:12.5px}
.pp-l:hover{color:var(--blue)}
.startdot{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #202124;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.rtip{position:absolute;transform:translate(-50%,-130%);background:#fff;color:var(--txt);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.rtip.on{background:var(--blue);color:#fff}
.me{width:24px;height:24px;position:relative}
.me .pulse{position:absolute;inset:-14px;border-radius:50%;background:rgba(66,133,244,.18);animation:pl 2s ease-out infinite}
@keyframes pl{0%{transform:scale(.4);opacity:1}100%{transform:scale(1);opacity:0}}
.me .core{position:absolute;inset:3px;border-radius:50%;background:var(--blue2);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.me .navarr{position:absolute;inset:-8px;display:none;transition:transform .2s linear}
.me .navarr svg{width:40px;height:40px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45))}
.me.nav .core,.me.nav .pulse{display:none}
.me.nav .navarr{display:block}

/* ---------- Dẫn đường ---------- */
.navwrap{position:fixed;z-index:1100;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 8px);width:min(460px,calc(100% - var(--sal) - var(--sar) - 16px));display:none}
.navtop{background:#0b8043;color:#fff;border-radius:14px 14px 14px 14px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
.navtop.hasnext{border-radius:14px 14px 0 0}
.navtop .arr svg{width:50px;height:50px;fill:#fff}
.navtop .nt{min-width:0;flex:1}
.navtop .d{font-size:28px;font-weight:700;line-height:1.1}
.navtop .i{font-size:17px;line-height:1.3;margin-top:2px}
.navnext{background:#0a6b37;color:#e6f4ea;border-radius:0 0 14px 14px;padding:7px 16px;display:flex;gap:10px;align-items:center;font-size:14px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.navnext svg{width:20px;height:20px;fill:#fff}
.navbot{position:fixed;z-index:1100;left:0;right:0;bottom:0;background:#fff;padding:12px calc(16px + var(--sar)) calc(12px + var(--sab)) calc(16px + var(--sal));display:none;align-items:center;gap:14px;box-shadow:0 -2px 8px rgba(0,0,0,.15);border-radius:16px 16px 0 0}
.navbot .x{background:#f1f3f4;color:#d93025;width:46px;height:46px}
.navbot .nb{flex:1;text-align:center;min-width:0}
.navbot .nb-t{font-size:22px;font-weight:600;color:var(--green)}
.navbot .nb-s{font-size:14px;color:var(--sub)}
.simbadge{font-size:12px;background:#fef7e0;color:#b06000;padding:4px 9px;border-radius:10px;white-space:nowrap}
.recenter{position:fixed;z-index:1100;right:calc(12px + var(--sar));bottom:calc(92px + var(--sab));height:44px;border-radius:22px;border:0;background:#fff;box-shadow:var(--shadow);padding:0 16px;display:flex;align-items:center;gap:8px;color:var(--blue);font-weight:600}
.recenter svg{width:20px;height:20px;fill:currentColor}
body.nav .ui{display:none}
body.nav .navwrap{display:block}
body.nav .navbot{display:flex}
body.nav .leaflet-control-zoom,body.nav .fab,body.nav .leaflet-control-layers{display:none}
body.nav .leaflet-bottom{bottom:calc(76px + var(--sab))!important}

/* ---------- Toast & modal ---------- */
.toast{position:fixed;z-index:3000;left:50%;bottom:calc(24px + var(--sab) + var(--sheet-h));transform:translateX(-50%) translateY(20px);background:#323232;color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.nav .toast{bottom:calc(96px + var(--sab))}
.modal{position:fixed;inset:0;z-index:2000;background:rgba(32,33,36,.5);display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab))}
.mbox{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:100%;overflow:auto;padding:20px 22px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 14px;font-size:19px;font-weight:500}
.mbox label.lb{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:500}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;height:40px;border:1px solid var(--bd);border-radius:8px;padding:0 12px;font-size:15px;outline:0}
.row input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.hint{font-size:13px;color:var(--sub);line-height:1.5;margin-top:8px;background:#f8f9fa;border-radius:8px;padding:10px 12px}
.hint code{background:#e8f0fe;color:var(--blue);padding:1px 5px;border-radius:4px;word-break:break-all}
.hint a{color:var(--blue)}
.sw{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14.5px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--blue)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:38px;border:0;background:#fff;font-weight:500;color:var(--sub)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:#e8f0fe;color:var(--blue)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* ---------- Mobile ---------- */
@media (max-width:640px){
  .ui{left:calc(var(--sal) + 8px);right:calc(var(--sar) + 8px);width:auto;top:calc(var(--sat) + 8px)}
  .panel{position:fixed;left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:52vh;padding-bottom:calc(var(--sab) + 6px);box-shadow:0 -2px 10px rgba(0,0,0,.18);transition:max-height .25s}
  .panel.min{max-height:calc(112px + var(--sab));overflow:hidden}
  .handle{display:block;position:sticky;top:0;z-index:2;background:#fff;height:22px;cursor:pointer}
  .handle::after{content:"";position:absolute;left:50%;top:8px;width:40px;height:5px;border-radius:3px;background:#dadce0;transform:translateX(-50%)}
  .leaflet-bottom{bottom:var(--sheet-h)}
  .leaflet-bottom.leaflet-right{margin-right:var(--sar)}
  .navtop .d{font-size:25px}
  .navtop .i{font-size:16px}
  .navwrap{width:calc(100% - var(--sal) - var(--sar) - 16px)}
  .pt{font-size:20px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="ui" id="ui">
  <div class="card searchbar" id="sbar">
    <button class="ibtn" id="menuBtn" title="Menu"></button>
    <input id="q" placeholder="Tìm kiếm trên Lối Đi" autocomplete="off" enterkeyhint="search" spellcheck="false">
    <button class="ibtn" id="qClear" title="Xóa" hidden></button>
    <div class="vsep"></div>
    <button class="ibtn blue" id="dirBtn" title="Chỉ đường"></button>
  </div>

  <div class="card dircard" id="dcard" hidden>
    <div class="dirrow">
      <button class="ibtn" id="dirClose" title="Quay lại"></button>
      <div class="dirinputs">
        <div class="fld"><span class="dot a"></span><input id="qFrom" placeholder="Chọn điểm xuất phát (để trống = GPS)" autocomplete="off" spellcheck="false"></div>
        <div class="fld"><span class="dot b"></span><input id="qTo" placeholder="Chọn điểm đến" autocomplete="off" spellcheck="false"></div>
      </div>
      <button class="ibtn" id="swapBtn" title="Đảo chiều"></button>
    </div>
    <div class="modes" id="modes">
      <button class="mode" data-p="car"></button>
      <button class="mode" data-p="bike"></button>
      <button class="mode" data-p="foot"></button>
    </div>
  </div>

  <div class="card menu" id="menu" hidden>
    <button id="mFav"></button>
    <button id="mSet"></button>
    <button id="mLoc"></button>
  </div>

  <div class="card sugg" id="sugg" hidden></div>

  <div class="card panel" id="panel" hidden>
    <div class="handle" id="handle"></div>
    <div id="pbody"></div>
  </div>
</div>

<!-- Dẫn đường -->
<div class="navwrap" id="navWrap">
  <div class="navtop" id="navTop">
    <div class="arr" id="nIcon"></div>
    <div class="nt"><div class="d" id="nDist"></div><div class="i" id="nInstr"></div></div>
  </div>
  <div class="navnext" id="navNext" hidden></div>
</div>
<button class="recenter" id="recenter" hidden></button>
<div class="navbot" id="navBot">
  <button class="ibtn x" id="navStop" title="Thoát dẫn đường"></button>
  <div class="nb"><div class="nb-t" id="nTime"></div><div class="nb-s" id="nRem"></div></div>
  <span class="simbadge" id="simBadge" hidden></span>
</div>

<!-- Cài đặt -->
<div class="modal" id="setModal" hidden>
  <div class="mbox" role="dialog" aria-label="Cài đặt">
    <h3>Cài đặt thông báo</h3>
    <div class="hint">Thông báo dẫn đường được gửi tới Telegram bot đã cấu hình sẵn. Bấm <b>Gửi thử</b> để kiểm tra.</div>
    <label class="sw"><input type="checkbox" id="notifyChk"> Gửi thông báo về điện thoại khi dẫn đường</label>
    <label class="sw"><input type="checkbox" id="voiceChk"> Đọc hướng dẫn bằng giọng nói</label>
    <label class="lb">Tốc độ mô phỏng</label>
    <div class="seg" id="simSeg"><button data-s="2">x2</button><button data-s="4">x4</button><button data-s="8">x8</button></div>
    <div class="mact">
      <button class="btn" id="testPush">Gửi thử</button>
      <button class="btn" id="setClose">Đóng</button>
      <button class="btn primary" id="setSave">Lưu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
if(!window.L){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">Không tải được thư viện bản đồ Leaflet. Vui lòng kiểm tra kết nối mạng.</p>';return;}

/* ================= Hằng số & tiện ích ================= */
const HN_BBOX=[105.28,20.56,106.02,21.39];
const HN_VIEWBOX='105.28,21.39,106.02,20.56';
const HN_CENTER=[21.0285,105.8542];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const isMobile=()=>matchMedia('(max-width:640px)').matches;
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const low=s=>s?s.charAt(0).toLowerCase()+s.slice(1):s;

const P={
  menu:'M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z',
  close:'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  dir:'M21.71 11.29l-9-9a.996.996 0 0 0-1.41 0l-9 9a.996.996 0 0 0 0 1.41l9 9c.39.39 1.02.39 1.41 0l9-9a.996.996 0 0 0 0-1.41zM14 14.5V12h-4v3H8v-4c0-.55.45-1 1-1h5V7.5l3.5 3.5-3.5 3.5z',

function fmtDist(m){if(m<1000)return (m<100?Math.max(5,Math.round(m/5)*5):Math.round(m/10)*10)+' m';return (m/1000).toFixed(m<10000?1:0).replace('.',',')+' km';}

/* ================= Hình học ================= */
const toR=Math.PI/180;
function hav(a,b){const dLa=(b[0]-a[0])*toR,dLo=(b[1]-a[1])*toR,s=Math.sin(dLa/2)**2+Math.cos(a[0]*toR)*Math.cos(b[0]*toR)*Math.sin(dLo/2)**2;return 2*6371008.8*Math.asin(Math.sqrt(s));}
function bearing(a,b){const y=Math.sin((b[1]-a[1])*toR)*Math.cos(b[0]*toR),x=Math.cos(a[0]*toR)*Math.sin(b[0]*toR)-Math.sin(a[0]*toR)*Math.cos(b[0]*toR)*Math.cos((b[1]-a[1])*toR);return (Math.atan2(y,x)/toR+360)%360;}
/* Chiếu điểm lên tuyến: trả về {dist, seg, along} */
function project(R,ll,from=0,to=Infinity,early=false){
  const pts=R.pts,kx=111320*Math.cos(ll[0]*toR),ky=110540;let best={dist:Infinity,seg:0,along:0};
  const end=Math.min(pts.length-1,to);
  for(let i=Math.max(0,from);i<end;i++){
    const ax=(pts[i][1]-ll[1])*kx,ay=(pts[i][0]-ll[0])*ky,bx=(pts[i+1][1]-ll[1])*kx,by=(pts[i+1][0]-ll[0])*ky;
    const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;const t=l2?clamp(-(ax*dx+ay*dy)/l2,0,1):0;
    const d=Math.hypot(ax+t*dx,ay+t*dy);
    if(d<best.dist){best={dist:d,seg:i,along:R.cum[i]+t*(R.cum[i+1]-R.cum[i])};if(early&&d<3)break;}
  }
  return best;
}
function pointAt(R,along){
  const c=R.cum,p=R.pts;along=clamp(along,0,R.total);
  let lo=0,hi=c.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=along)lo=m;else hi=m;}
  const seg=c[hi]-c[lo],t=seg?(along-c[lo])/seg:0;
  return {ll:[p[lo][0]+(p[hi][0]-p[lo][0])*t,p[lo][1]+(p[hi][1]-p[lo][1])*t],hd:bearing(p[lo],p[hi]),seg:lo};
}

/* ================= Dịch hướng dẫn OSRM ================= */
const DIR={'uturn':'quay đầu','sharp right':'rẽ gắt sang phải','right':'rẽ phải','slight right':'chếch sang phải','straight':'đi thẳng','slight left':'chếch sang trái','left':'rẽ trái','sharp left':'rẽ gắt sang trái'};
const SIDE=m=>!m?'':/left/.test(m)?' bên trái':/right/.test(m)?' bên phải':'';
const ORD=['thứ nhất','thứ hai','thứ ba','thứ tư','thứ năm','thứ sáu','thứ bảy','thứ tám','thứ chín','thứ mười'];
const COMPASS=['bắc','đông bắc','đông','đông nam','nam','tây nam','tây','tây bắc'];
function roadOf(s){const n=s.name||'';const r=s.ref||'';return n&&r&&!n.includes(r)?`${n} (${r})`:(n||r);}
function turnKey(a){
  const d=((a%360)+540)%360-180,x=Math.abs(d);
  if(x<=22)return 'straight';
  if(x>=150)return 'uturn';
  return (d>0?'':'')+(x<60?'slight ':x>=125?'sharp ':'')+(d>0?'right':'left');
}
function roundaboutDir(s,next){
  const m=s.maneuver||{};
  const nb=next&&next.maneuver&&next.maneuver.bearing_after;
  if(typeof m.bearing_before==='number'&&typeof nb==='number')return turnKey(nb-m.bearing_before);
  return m.modifier||null;
}
function instr(s,next){
  const m=s.maneuver||{},t=m.type,mod=m.modifier,road=roadOf(s);
  const onto=road?` vào ${road}`:'',on=road?` trên ${road}`:'';
  const d=DIR[mod];
  switch(t){
    case 'depart':return `Xuất phát về hướng ${COMPASS[Math.round((m.bearing_after||0)/45)%8]}`+(road?` trên ${road}`:'');
    case 'arrive':return 'Đến nơi'+(mod&&/left|right/.test(mod)?`, điểm đến ở${SIDE(mod)}`:'');
    case 'turn':
      if(mod==='uturn')return 'Quay đầu'+(road?` về ${road}`:'');
      if(mod==='straight')return 'Đi thẳng'+onto;
      return cap(d||'rẽ')+onto;
    case 'new name':return road?`Tiếp tục đi vào ${road}`:'Tiếp tục đi thẳng';
    case 'continue':
      if(mod==='uturn')return 'Quay đầu'+(road?` về ${road}`:'');
      if(!mod||mod==='straight')return 'Tiếp tục đi thẳng'+on;
      return cap(d)+' để tiếp tục'+on;
    case 'merge':return 'Nhập làn'+SIDE(mod)+onto;
    case 'on ramp':return 'Đi vào đường nhánh'+SIDE(mod)+onto;
    case 'off ramp':return 'Rẽ ra lối'+SIDE(mod)+(road?` để vào ${road}`:'');
    case 'fork':return `Đi theo nhánh ${/left/.test(mod||'')?'bên trái':/right/.test(mod||'')?'bên phải':'ở giữa'} tại ngã ba`+onto;
    case 'end of road':return 'Đến cuối đường, '+(d||'rẽ')+onto;
    case 'roundabout':case 'rotary':
      {const rd=roundaboutDir(s,next),w=rd?DIR[rd]:'';
      const way=w?(rd==='straight'?'đi thẳng':w):'';
      return 'Vào vòng xuyến'+(m.exit?`, đi theo lối ra ${ORD[m.exit-1]||'số '+m.exit}`:'')+(way?` (${way})`:'')+onto;}
    case 'roundabout turn':return 'Tại vòng xuyến, '+(d||'đi tiếp')+onto;
    case 'exit roundabout':case 'exit rotary':return 'Ra khỏi vòng xuyến'+onto;
    case 'use lane':return 'Giữ làn để '+(d||'đi thẳng')+on;
    default:return d?cap(d)+onto:'Tiếp tục'+on;
  }
}
function iconFor(type,mod){
  if(type==='arrive')return svg(P.aFlag);
  if(type==='depart')return svg(P.aDepart);
  if(/roundabout|rotary/.test(type||''))return svg(P.aRound);
  switch(mod){
    case 'uturn':return svg(P.aUturn);
    case 'right':return svg(P.aTurn);
    case 'left':return svg(P.aTurn,MIR);
    case 'slight right':return svg(P.aStraight,'rotate(45 12 12)');
    case 'slight left':return svg(P.aStraight,'rotate(-45 12 12)');

    case 'sharp left':return svg(P.aStraight,'rotate(-135 12 12)');
    default:return svg(P.aStraight);
  }
}
function dirKey(type,mod,rd){return (/^(roundabout|rotary)$/.test(type||'')?rd:mod)||(/roundabout|rotary/.test(type||'')?mod:'')||'straight';}
function emojiFor(type,mod,rd){
  if(type==='arrive')return 'D';
  const k=dirKey(type,mod,rd);
  if(/roundabout|rotary/.test(type||'')){
    return '@'+(k==='uturn'?'↩️':/right/.test(k)?'➡️':/left/.test(k)?'⬅️':'⬆️');
  }
  return {'uturn':'↩️','right':'➡️','left':'⬅️','slight right':'↗️','slight left':'↖️','sharp right':'➡️','sharp left':'⬅️'}[mod]||'⬆️';
}
function wordFor(type,mod,rd){
  if(type==='arrive')return 'ĐẾN NƠI';

async function fetchJSON(url,ms=9000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(t);}}
const uniqJoin=a=>{const o=[];a.forEach(x=>{if(x&&!o.includes(x))o.push(x);});return o.join(', ');};

async function photon(q,bounded){
  const p=new URLSearchParams({q,limit:8});
  if(bounded)p.set('bbox',HN_BBOX.join(','));else{p.set('lat',HN_CENTER[0]);p.set('lon',HN_CENTER[1]);}
  const j=await fetchJSON('https://photon.komoot.io/api/?'+p);
  return (j.features||[]).map(f=>{const pr=f.properties||{},c=f.geometry.coordinates;
    const street=[pr.housenumber,pr.street].filter(Boolean).join(' ');
    const name=pr.name||street||pr.district||pr.city||'Địa điểm';
    return {name,addr:uniqJoin([street!==name?street:'',pr.locality,pr.district,pr.city||pr.county,pr.state,pr.country]),lat:c[1],lng:c[0]};});
}
async function nominatim(q,bounded){
  const p=new URLSearchParams({q,format:'jsonv2',limit:8,'accept-language':'vi',countrycodes:'vn'});
  if(bounded){p.set('viewbox',HN_VIEWBOX);p.set('bounded','1');}
  const j=await fetchJSON('https://nominatim.openstreetmap.org/search?'+p);
  return (j||[]).map(r=>{const parts=(r.display_name||'').split(', ');const name=r.name||parts[0];return {name,addr:parts.filter(x=>x!==name).join(', '),lat:+r.lat,lng:+r.lon};});
}
async function reverseGeo(lat,lng){
  try{const j=await fetchJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=vi&zoom=18`);
    const parts=(j.display_name||'').split(', ');const name=j.name||parts.slice(0,2).join(', ');
    return {name:name||'Vị trí đã ghim',addr:parts.filter(x=>x&&!name.includes(x)).slice(0,5).join(', ')};
  }catch(e){return {name:'Vị trí đã ghim',addr:''};}
}

  activeField=field;el.menu.hidden=true;
  const inp=fieldInput(field),v=inp.value.trim();
  if(field==='q')el.qClear.hidden=!inp.value;
  if(field==='from'&&S.from&&v!==S.from.name){S.from=null;drawEndpoints();}
  if(field==='to'&&S.to&&v!==S.to.name){S.to=null;drawEndpoints();}
  clearTimeout(debT);
  if(v.length<2){searchSeq++;showDefaultSugg(field);return;}
  debT=setTimeout(()=>doSearch(v,field),400);
}
async function doSearch(q,field){
  const my=++searchSeq;showSuggMsg('Đang tìm…');
  const tries=[()=>photon(q,true),()=>nominatim(q,true),()=>photon(q,false),()=>nominatim(q,false)];
  let res=[];
  for(const f of tries){try{res=await f();}catch(e){res=[];}if(my!==searchSeq)return;if(res.length)break;}
  const seen=new Set();res=res.filter(r=>{const k=r.name+'|'+r.lat.toFixed(4)+','+r.lng.toFixed(4);if(seen.has(k))return false;seen.add(k);return true;});
  if(document.activeElement!==fieldInput(field)&&my===searchSeq&&!el.sugg.matches(':hover')){/* vẫn hiện để người dùng chọn */}
  renderSugg(res,field,q);
}
function itemHTML(i,ic,cls,t,s){return `<div class="it" data-i="${i}"><div class="ic ${cls||''}">${svg(ic)}</div><div class="tx"><div class="t">${esc(t)}</div>${s?`<div class="s">${esc(s)}</div>`:''}</div></div>`;}
function renderSugg(list,field,q){
  lastResults=list.map(p=>({p}));
  if(!list.length){showSuggMsg(`Không tìm thấy “${esc(q)}”. Thử từ khóa khác hoặc chọn trực tiếp trên bản đồ.`);return;}
  el.sugg.innerHTML=list.map((p,i)=>itemHTML(i,P.pin,'',p.name,p.addr)).join('');
  el.sugg.hidden=false;bindSugg(field);
}
function showDefaultSugg(field){
  const favs=getFavs();const items=[];
  if(field!=='q')items.push({me:true});
  favs.slice(0,6).forEach(f=>items.push({p:f,fav:true}));
  lastResults=items;
  if(!items.length){hideSugg();return;}
  el.sugg.innerHTML=items.map((x,i)=>x.me?itemHTML(i,P.loc,'me','Vị trí của bạn','Dùng GPS hiện tại'):itemHTML(i,P.star,'fav',x.p.name,x.p.addr)).join('');
  el.sugg.hidden=false;bindSugg(field);
}
function bindSugg(field){
  el.sugg.querySelectorAll('.it').forEach(n=>{
    n.addEventListener('mousedown',e=>e.preventDefault());
    n.addEventListener('click',()=>pickResult(lastResults[+n.dataset.i],field));
  });
}
async function pickResult(x,field){
  if(!x)return;hideSugg();
  if(x.me){
    try{const p=await getPos();choosePlace({lat:p.lat,lng:p.lng,name:'Vị trí của bạn',me:true},field);}
    catch(e){toast(e.message);}
    return;
  }
  choosePlace(x.p,field);
}
function choosePlace(p,field){
  const inp=fieldInput(field);inp.blur();
  if(field==='q'){inp.value=p.name;el.qClear.hidden=false;showPlace(p);return;}
  if(field==='from'){S.from=p;el.qFrom.value=p.name;}else{S.to=p;el.qTo.value=p.name;}
  drawEndpoints();
  if(S.to)route();else{el.qTo.focus();map.flyTo([p.lat,p.lng],15);}
}

['q','from','to'].forEach(f=>{

function drawEndpoints(){

/* ================= GPS ================= */
function getPos(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej(new Error('Trình duyệt không hỗ trợ GPS.'));
    navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>rej(new Error(e.code===1?'Bạn đã từ chối quyền vị trí. Hãy bật quyền định vị cho trang này.':'Không lấy được vị trí GPS hiện tại.')),
      {enableHighAccuracy:true,timeout:12000,maximumAge:15000});
  });
}
function ensureMe(ll){if(!meMarker)meMarker=L.marker(ll,{icon:meIcon,zIndexOffset:1000,interactive:false,keyboard:false}).addTo(map);else meMarker.setLatLng(ll);return meMarker;}
async function locateMe(){
  el.menu.hidden=true;toast('Đang xác định vị trí…',1500);
  try{const p=await getPos();ensureMe([p.lat,p.lng]);map.flyTo([p.lat,p.lng],17,{duration:.8});}catch(e){toast(e.message);}
}

/* ================= Định tuyến OSRM ================= */
const OSRM={car:'routed-car',bike:'routed-bike',foot:'routed-foot'};
let routeSeq=0;
function osrmURL(a,b,alt=true){return `https://routing.openstreetmap.de/${OSRM[S.profile]}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?alternatives=${alt}&steps=true&geometries=geojson&overview=full`;}
function prepRoute(r){
  const pts=r.geometry.coordinates.map(c=>[c[1],c[0]]);
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hav(pts[i-1],pts[i]));
  const R={pts,cum,total:cum[cum.length-1]||0,distance:r.distance,duration:r.duration,summary:(r.legs||[]).map(l=>l.summary).filter(Boolean).join(', ')};
  const raw=[];(r.legs||[]).forEach(l=>(l.steps||[]).forEach(s=>raw.push(s)));
  let seg=0;
  R.steps=raw.map((s,k)=>{
    const m=s.maneuver,ll=[m.location[1],m.location[0]];let along;
    if(k===0)along=0;else if(k===raw.length-1)along=R.total;else{const p=project(R,ll,seg,Infinity,true);seg=p.seg;along=p.along;}
    return {type:m.type,mod:m.modifier,ll,along,distance:s.distance,name:roadOf(s),rd:/^(roundabout|rotary)$/.test(m.type||'')?roundaboutDir(s,raw[k+1]):null,text:instr(s,raw[k+1])};
  });
  R.speed=r.duration>0?r.distance/r.duration:8;
  return R;
}
async function route(){
  if(!S.to)return;
  const my=++routeSeq;
  if(!S.from){
    loadingPanel('dir');el.qFrom.value='Đang lấy vị trí GPS…';
    try{const p=await getPos();if(my!==routeSeq)return;S.from={lat:p.lat,lng:p.lng,name:'Vị trí của bạn',me:true};el.qFrom.value=S.from.name;ensureMe([p.lat,p.lng]);}
    catch(e){if(my!==routeSeq)return;el.qFrom.value='';setPanel('dir',`<div class="err">${esc(e.message)}<br>Hãy nhập hoặc chọn điểm xuất phát trên bản đồ.</div>`);el.qFrom.focus();return;}
  }
  drawEndpoints();loadingPanel('dir');
  try{
    const j=await fetchJSON(osrmURL(S.from,S.to,true),20000);
    if(my!==routeSeq)return;
    if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error(j.message||'Không tìm thấy tuyến đường phù hợp.');
    S.routes=j.routes.map(prepRoute);S.sel=0;
    drawRoutes();fitRoute();renderDirPanel();
  }catch(e){
    if(my!==routeSeq)return;routeLayer.clearLayers();S.routes=[];
    setPanel('dir',`<div class="err">Không thể tìm đường: ${esc(e.name==='AbortError'?'máy chủ phản hồi quá lâu':e.message)}</div><div class="pb" style="padding-top:0"><button class="btn" id="retry">Thử lại</button></div>`);
    $('#retry').onclick=route;
  }
}
function drawRoutes(onlySel){
  routeLayer.clearLayers();
  const order=S.routes.map((_,i)=>i).filter(i=>i!==S.sel).concat([S.sel]);
  order.forEach(i=>{
    const R=S.routes[i],on=i===S.sel;
    if(onlySel&&!on)return;
    const o=L.polyline(R.pts,{color:on?'#1557b0':'#7a8ba8',weight:on?10:8,opacity:on?1:.75,lineJoin:'round',lineCap:'round',bubblingMouseEvents:false}).addTo(routeLayer);
    const f=L.polyline(R.pts,{color:on?'#4285f4':'#bccbe3',weight:on?7:5.5,opacity:1,lineJoin:'round',lineCap:'round',bubblingMouseEvents:false}).addTo(routeLayer);
    if(!on){[o,f].forEach(l=>l.on('click',()=>selectRoute(i)));}
    if(!onlySel&&S.routes.length>1){
      const at=pointAt(R,R.total*(0.3+0.2*i)).ll;
      L.marker(at,{icon:L.divIcon({className:'',html:`<div class="rtip ${on?'on':''}">${fmtDur(R.duration)}</div>`,iconSize:[0,0]}),zIndexOffset:on?900:800}).on('click',()=>selectRoute(i)).addTo(routeLayer);
    }
  });
}
function selectRoute(i){if(i===S.sel)return;S.sel=i;drawRoutes();renderDirPanel();}
function fitRoute(){
  const R=S.routes[S.sel];if(!R)return;const b=L.latLngBounds(R.pts);
  if(isMobile()){const top=(el.dcard.offsetHeight||140)+24;map.fitBounds(b,{paddingTopLeft:[24,top],paddingBottomRight:[24,Math.min(innerHeight*.52,(el.panel.offsetHeight||260))+24]});}
  else map.fitBounds(b,{paddingTopLeft:[440,40],paddingBottomRight:[70,40]});
}
function renderDirPanel(){
  const R=S.routes[S.sel];if(!R)return;
  const rts=S.routes.map((r,i)=>`<div class="rt ${i===S.sel?'on':''}" data-i="${i}"><div class="l">
      <div class="t">${fmtDur(r.duration)}<small>${fmtDist(r.distance)}</small></div>
      <div class="s">${r.summary?'Qua '+esc(r.summary):'Tuyến '+(i+1)}</div></div>${i===0?'<span class="badge">Tốt nhất</span>':''}</div>`).join('');
  const steps=R.steps.map((s,k)=>`<div class="step" data-k="${k}"><div class="si">${iconFor(s.type,s.mod)}</div><div class="sx"><div class="st">${esc(k===R.steps.length-1?'Đến nơi: '+S.to.name:s.text)}</div>${s.distance>0?`<div class="sd">${fmtDist(s.distance)}</div>`:''}</div></div>`).join('');
  setPanel('dir',`<div class="hdr"><h3>${MODES[S.profile][0]} · ${S.routes.length} tuyến</h3></div>${rts}
    <div class="pb" style="padding-top:8px"><div class="actions" style="margin-top:4px">
      <button class="btn primary" id="goBtn">${svg(P.nav)}Bắt đầu</button>
      <button class="btn" id="simBtn">${svg(P.play)}Mô phỏng x${SET.sim}</button>
      <button class="btn" id="favTo">${svg(P.star)}Lưu điểm đến</button>
    </div></div><div class="divider"></div>${steps}`);
  el.pbody.querySelectorAll('.rt').forEach(n=>n.onclick=()=>selectRoute(+n.dataset.i));
  el.pbody.querySelectorAll('.step').forEach(n=>n.onclick=()=>{const s=R.steps[+n.dataset.k];map.flyTo(s.ll,18,{duration:.6});if(isMobile())el.panel.classList.add('min');setTimeout(updSheet,260);});
  $('#goBtn').onclick=()=>startNav(false);
  $('#simBtn').onclick=()=>startNav(true);
  $('#favTo').onclick=()=>addFav(S.to);
}

  });
}

const ARROWS={
  '\u27a1':[' '.repeat(5)+'|╲','|▔▔'+' '.repeat(3)+'╲','|'+' '.repeat(8)+'╱','▔▔|╱'].join('\n'),      /* PHẢI */
  '\u2b05':[' '.repeat(3)+'╱|','╱'+' '.repeat(3)+'▔▔▔','╲'+' '.repeat(8)+'',' '.repeat(3)+'╲|▔▔▔'].join('\n'),  /* TRÁI */
  '\u2b06':[' '.repeat(3)+'╱╲','╱'+' '.repeat(6)+'╲','▔|'+' '.repeat(5)+'|▔',' '.repeat(2)+'|_____|'].join('\n'),    /* THẲNG */
  '\u21a9':['   _______','  |    ___    |','_|   |_    |   |','╲╱     |   |'].join('\n'),    /* QUAY ĐẦU */
  '\u2197':['   ╱\\','  /  /',' /  /','/  /','▔'].join('\n'),    /* CHẾCH PHẢI */
  '\u2196':['/╲',' \\  \\','  \\  \\','   \\  \\','    ▔'].join('\n')    /* CHẾCH TRÁI */
};
async function sendTelegram(token,chat,m){
  /* Mũi tên phải/trái/thẳng: thay emoji bằng hình mũi tên ký tự (monospace trong <pre>) */
  let title=m.title,art='';
  const am=/[\u27a1\u2b05\u2b06\u21a9\u2197\u2196]\ufe0f?/.exec(title);
  if(am){art=ARROWS[am[0][0]];title=title.replace(am[0],'').replace(/\s+/g,' ').trim();}
  const text='<b>'+esc(title)+'</b>\n'+(art?'<pre>'+esc(art)+'</pre>\n':'')+esc(m.message);
  const r=await fetch('https://api.telegram.org/bot'+encodeURIComponent(token)+'/sendMessage',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:chat,text,parse_mode:'HTML',disable_notification:(m.prio||3)<=2,disable_web_page_preview:true})
  });
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok||!j||!j.ok)throw new Error((j&&j.description)||('HTTP '+r.status));
}
async function drainPush(){
  if(pushing)return;pushing=true;
  while(pushQ.length){
    const m=pushQ.shift();
    try{await sendTelegram(SET.tgToken,SET.tgChat,m);}
    catch(e){console.warn('telegram',e);
      const mm=/retry after (\d+)/i.exec(e.message||'');if(mm)await sleep((+mm[1]+1)*1000);}
    await sleep(1000);
  }
  pushing=false;
}
let viVoice=null;
function pickVoice(){if(!('speechSynthesis' in window))return;viVoice=speechSynthesis.getVoices().find(v=>/^vi/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){
  if(!SET.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/(\d+) m\b/g,'$1 mét').replace(/([\d,]+) km\b/g,'$1 ki lô mét'));
    u.lang='vi-VN';if(viVoice)u.voice=viVoice;speechSynthesis.speak(u);}catch(e){}
}
let wakeLock=null;
async function wake(on){try{if(on&&navigator.wakeLock)wakeLock=await navigator.wakeLock.request('screen');else if(!on&&wakeLock){await wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&NAV.active)wake(true);});

/* ================= Dẫn đường ================= */
let NAV={active:false};
function startNav(sim){
  const R=S.routes[S.sel];if(!R)return;
  map.closePopup();
  NAV={active:true,sim,R,along:0,ni:1,flags:{},timer:null,watch:null,last:performance.now(),lastSeg:0,off:0,follow:true,lastReroute:0,arrived:false,speed:R.speed*SET.sim};
  S.mode='nav';document.body.classList.add('nav');
  drawRoutes(true);
  const me=ensureMe(R.pts[0]);const e=me.getElement();if(e)e.querySelector('.me').classList.add('nav');
  $('#simBadge').hidden=!sim;$('#simBadge').textContent='Mô phỏng x'+SET.sim;
  $('#recenter').hidden=true;
  map.setView(R.pts[0],17,{animate:true});
  const first=R.steps[0];
  push(`🧭 Bắt đầu${sim?' (mô phỏng)':''}`,`Đến ${S.to.name}\n${fmtDist(R.distance)} · ${fmtDur(R.duration)} · ${MODES[S.profile][0]}\n${first?first.text:''}`,3,['round_pushpin']);
  speak(`Bắt đầu dẫn đường đến ${S.to.name}. ${first?first.text:''}`);
  wake(true);
  if(sim){NAV.timer=setInterval(simTick,200);}
  else{
    if(!navigator.geolocation){toast('Trình duyệt không hỗ trợ GPS');stopNav();return;}
    NAV.watch=navigator.geolocation.watchPosition(onGps,err=>toast(err.code===1?'Chưa cấp quyền vị trí, không thể dẫn đường bằng GPS':'Mất tín hiệu GPS…'),{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  }
  updateNav(R.pts[0],pointAt(R,0).hd);
}
function simTick(){
  const now=performance.now(),dt=Math.min(1,(now-NAV.last)/1000);NAV.last=now;
  NAV.along=Math.min(NAV.R.total,NAV.along+NAV.speed*dt);
  const p=pointAt(NAV.R,NAV.along);updateNav(p.ll,p.hd);
}
function onGps(pos){
  if(!NAV.active||NAV.arrived)return;
  const ll=[pos.coords.latitude,pos.coords.longitude],acc=pos.coords.accuracy||30,R=NAV.R;
  let pr=project(R,ll,NAV.lastSeg-5,NAV.lastSeg+80);
  if(pr.dist>40)pr=project(R,ll);
  if(pr.dist>Math.max(50,acc*1.2)){NAV.off++;}else{NAV.off=0;}
  if(NAV.off>=3&&Date.now()-NAV.lastReroute>15000){NAV.off=0;reroute(ll);return;}
  if(pr.dist<=Math.max(50,acc)){NAV.lastSeg=pr.seg;NAV.along=Math.max(NAV.along-30,pr.along);}
  const snap=pr.dist<30?pointAt(R,NAV.along):null;
  let hd=snap?snap.hd:(pos.coords.heading!=null&&!isNaN(pos.coords.heading)?pos.coords.heading:null);
  updateNav(snap?snap.ll:ll,hd);
}
async function reroute(ll){
  NAV.lastReroute=Date.now();toast('Bạn đã đi lệch tuyến — đang tìm đường mới…');
  try{
    const j=await fetchJSON(osrmURL({lat:ll[0],lng:ll[1]},S.to,false),15000);
    if(!NAV.active||j.code!=='Ok'||!j.routes||!j.routes.length)return;
    const R=prepRoute(j.routes[0]);S.from={lat:ll[0],lng:ll[1],name:'Vị trí của bạn',me:true};S.routes=[R];S.sel=0;
    Object.assign(NAV,{R,along:0,ni:1,flags:{},lastSeg:0,speed:R.speed*SET.sim});
    drawRoutes(true);
    push('↻ Đã tính lại tuyến',`Còn ${fmtDist(R.distance)} · ${fmtDur(R.duration)}\n${R.steps[1]?R.steps[1].text:''}`,3,['arrows_counterclockwise']);
    speak('Đã tính lại tuyến đường.');
  }catch(e){}
}
function updateNav(ll,hd){
  const R=NAV.R,st=R.steps,along=NAV.along;
  const me=ensureMe(ll);const e=me.getElement();
  if(e){const m=e.querySelector('.me');m.classList.add('nav');if(hd!=null)m.querySelector('.navarr').style.transform=`rotate(${hd}deg)`;}
  if(NAV.follow)map.panTo(ll,{animate:true,duration:.25,noMoveStart:true});

  /* Chuyển bước khi đã qua khúc cua (< 25 m) */
  while(NAV.ni<st.length-1&&st[NAV.ni].along-along<25){
    NAV.ni++;
    const nx=st[NAV.ni],gap=nx.along-along;
    if(gap>400&&!NAV.flags[NAV.ni+'c']){NAV.flags[NAV.ni+'c']=1;speak(`Đi tiếp ${fmtDist(gap)}`);}
  }
  const ni=NAV.ni,s=st[ni],isLast=ni>=st.length-1;
  const d=Math.max(0,(s?s.along:R.total)-along);

  /* Tới đích */
  if(isLast&&(d<25||along>=R.total-1)){arrive();return;}

  /* Cảnh báo */
  if(s&&!isMinor(s)){
    const emo=emojiFor(s.type,s.mod,s.rd),word=wordFor(s.type,s.mod,s.rd);
    if(d<60&&!NAV.flags[ni+'n']){
      NAV.flags[ni+'n']=NAV.flags[ni+'p']=1;
      const msg=isLast?`Điểm đến ở ngay phía trước${SIDE(s.mod)}`:s.text;
      push(`${emo} ${word} • Ngay`,`${msg}${isLast?'\n'+S.to.name:''}`,4,[]);
      speak(isLast?msg:'Bây giờ, '+low(s.text));
    }else if(d<250&&!NAV.flags[ni+'p']){
      NAV.flags[ni+'p']=1;
      const dd=fmtDist(d);
      const msg=isLast?`Sau ${dd}, bạn sẽ đến nơi`:`Sau ${dd}, ${low(s.text)}`;
      push(`${emo} ${word} • Sau ${dd}`,isLast?`Sắp đến ${S.to.name}`:s.text,3,[]);
      speak(msg);
    }
  }
  renderNav(s,d,isLast);
}
function renderNav(s,d,isLast){
  const R=NAV.R,st=R.steps;
  $('#nIcon').innerHTML=iconFor(isLast?'arrive':s.type,s.mod);
  $('#nDist').textContent=fmtDist(d);
  $('#nInstr').textContent=isLast?('Đến '+S.to.name):s.text;
  const nx=st[NAV.ni+1];const showNext=nx&&(nx.along-s.along)<400&&!isLast;
  $('#navNext').hidden=!showNext;$('#navTop').classList.toggle('hasnext',!!showNext);
  if(showNext)$('#navNext').innerHTML=`<span>Sau đó</span>${iconFor(nx.type,nx.mod)}<span>${esc(NAV.ni+1===st.length-1?'Đến nơi':nx.text)}</span>`;
  const rem=Math.max(0,R.total-NAV.along),secs=rem/R.speed;
  $('#nTime').textContent=fmtDur(secs);
  $('#nRem').textContent=`${fmtDist(rem)} · Đến lúc ${fmtClock(new Date(Date.now()+secs*1000/(NAV.sim?SET.sim:1)))}`;
}
function arrive(){
  if(NAV.arrived)return;NAV.arrived=true;
  clearInterval(NAV.timer);if(NAV.watch!=null)navigator.geolocation.clearWatch(NAV.watch);NAV.timer=null;NAV.watch=null;
  $('#nIcon').innerHTML=svg(P.aFlag);$('#nDist').textContent='Đã đến nơi';$('#nInstr').textContent=S.to.name;
  $('#navNext').hidden=true;$('#navTop').classList.remove('hasnext');
  $('#nTime').textContent='Bạn đã đến nơi 🎉';$('#nRem').textContent='Bấm ✕ để kết thúc';
  push('D Đã đến nơi',`${S.to.name}${S.to.addr?'\n'+S.to.addr:''}`,4,['checkered_flag']);
  speak('Bạn đã đến nơi. '+S.to.name);
  wake(false);
}
function stopNav(){
  if(!NAV.active)return;
  clearInterval(NAV.timer);if(NAV.watch!=null)navigator.geolocation.clearWatch(NAV.watch);
  if(!NAV.arrived)push('⏹ Đã dừng dẫn đường',`Chuyến đi đến ${S.to?S.to.name:''} đã kết thúc`,2,[]);
  NAV={active:false};wake(false);
  try{speechSynthesis.cancel();}catch(e){}
  document.body.classList.remove('nav');S.mode='dir';$('#recenter').hidden=true;
  if(meMarker){const e=meMarker.getElement();if(e)e.querySelector('.me').classList.remove('nav');}
  drawRoutes();renderDirPanel();setTimeout(fitRoute,50);
}
$('#navStop').addEventListener('click',stopNav);
map.on('dragstart',()=>{if(NAV.active){NAV.follow=false;$('#recenter').hidden=false;}});
$('#recenter').addEventListener('click',()=>{NAV.follow=true;$('#recenter').hidden=true;if(meMarker)map.setView(meMarker.getLatLng(),Math.max(map.getZoom(),17));});

/* ================= Hộp cài đặt ================= */
const mEl={modal:$('#setModal'),notify:$('#notifyChk'),voice:$('#voiceChk')};
let tmpSim=SET.sim;
function setSimBtns(){document.querySelectorAll('#simSeg button').forEach(b=>b.classList.toggle('on',+b.dataset.s===tmpSim));}
function openSettings(){mEl.notify.checked=SET.notify;mEl.voice.checked=SET.voice;tmpSim=SET.sim;setSimBtns();mEl.modal.hidden=false;}
function closeSettings(){mEl.modal.hidden=true;}
document.querySelectorAll('#simSeg button').forEach(b=>b.addEventListener('click',()=>{tmpSim=+b.dataset.s;setSimBtns();}));
$('#setClose').addEventListener('click',closeSettings);
mEl.modal.addEventListener('click',e=>{if(e.target===mEl.modal)closeSettings();});
$('#setSave').addEventListener('click',()=>{
  SET.notify=mEl.notify.checked;SET.voice=mEl.voice.checked;SET.sim=tmpSim;
  LS.set('loidi_notify',SET.notify);LS.set('loidi_voice',SET.voice);LS.set('loidi_sim_speed',SET.sim);
  closeSettings();toast('Đã lưu cài đặt');
  if(S.panel==='dir'&&S.routes.length)renderDirPanel();
});
$('#testPush').addEventListener('click',async()=>{
  const b=$('#testPush');b.disabled=true;b.textContent='Đang gửi…';
  try{await sendTelegram(TG_TOKEN,TG_CHAT,{title:'➡️ Gửi thử',message:'Sau 200 m, rẽ phải vào Phố Huế\nNếu bạn thấy tin này, thông báo Telegram đã hoạt động! 🎉',prio:4});toast('✅ Đã gửi tới Telegram');}
  catch(e){toast('❌ Gửi thất bại: '+e.message);}
  finally{b.disabled=false;b.textContent='Gửi thử';}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!mEl.modal.hidden)closeSettings();el.menu.hidden=true;}});

/* ================= Khởi động ================= */
setModeBtns();
})();
</script>
